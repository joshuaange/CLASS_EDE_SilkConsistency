# P-ACT: ACT DR6 (ACT-lite TT,TE,EE) + Planck TT<1000, TE/EE<600 + Planck low-ell TT
#        + Planck Sroll2 low-ell EE (as in ACT's yamls/p-act-lcdm.yaml): LCDM + EDE
theory:
  classy:
    path: global                 # = CLASS_EDE_SilkConsistency, installed in ~/envs/ede_cosmology
    ignore_obsolete: true        # CLASS_EDE is v3.2.2; Cobaya otherwise asks for >= v3.3.3
    extra_args:
      # ---- CLASS settings of the ACT DR6 analysis: Calabrese et al. 2025 (arXiv:2503.14454), Appendix A ----
      N_ncdm: 1
      m_ncdm: 0.06
      N_ur: 2.0308
      T_cmb: 2.7255
      YHe: BBN
      non_linear: hmcode
      # hmcode_version: '2020'   # not in public CLASS_EDE (v3.2.2): it uses HMcode-2016
      recombination: HyRec
      lensing: 'yes'
      output: tCl pCl lCl mPk
      modes: s
      l_max_scalars: 9500
      delta_l_max: 1800
      P_k_max_h/Mpc: 100.
      l_logstep: 1.025
      l_linstep: 20
      perturbations_sampling_stepsize: 0.05
      l_switch_limber: 30.
      hyper_sampling_flat: 32.
      l_max_g: 40
      l_max_ur: 35
      l_max_pol_g: 60
      ur_fluid_approximation: 2
      ur_fluid_trigger_tau_over_tau_k: 130.
      radiation_streaming_approximation: 2
      radiation_streaming_trigger_tau_over_tau_k: 240.
      hyper_flat_approximation_nu: 7000.
      transfer_neglect_delta_k_S_t0: 0.17
      transfer_neglect_delta_k_S_t1: 0.05
      transfer_neglect_delta_k_S_t2: 0.17
      transfer_neglect_delta_k_S_e: 0.17
      accurate_lensing: 1
      start_small_k_at_tau_c_over_tau_h: 0.0004
      start_large_k_at_tau_h_over_tau_k: 0.05
      tight_coupling_trigger_tau_c_over_tau_h: 0.005
      tight_coupling_trigger_tau_c_over_tau_k: 0.008
      start_sources_at_tau_c_over_tau_h: 0.006
      l_max_ncdm: 30
      tol_ncdm_synchronous: 1.e-6
      # ---- not in ACT's block: only switches on the damping-scale output rd_star (spectra unchanged) ----
      compute_damping_scale: 'yes'
      # ---- EDE: axion-like scalar field, n = 3 (CLASS_EDE; Hill et al. 2020, 2022) ----
      n_scf: 3
      CC_scf: 1
      Omega_Lambda: 0.0
      Omega_fld: 0
      Omega_scf: -1
      scf_parameters: '1, 1, 1, 1, 1, 0.0'
      scf_tuning_index: 3
      attractor_ic_scf: 'no'

likelihood:
  act_dr6_cmbonly.ACTDR6CMBonly:      # ACT DR6 TT,TE,EE, 600 < ell < 6500; samples A_act, P_act
    stop_at_error: true
  planck_2018_lowl.EE_sroll2: null    # large-scale EE, constrains tau (ACT can't on its own)
  planck_2018_lowl.TT: null           # Planck low-ell TT
  act_dr6_cmbonly.PlanckActCut:       # Planck plik-lite, cut to TT < 1000, TE/EE < 600
    dataset_params:
      use_cl: tt te ee
      lmin_cuts: 0 0 0
      lmax_cuts: 1000 600 600
    params:
      A_planck:                       # Planck calibration tied to ACT's, as in ACT's setup
        value: "lambda A_act: A_act"
        latex: A_{\rm Planck}

# ACT's calibration prior (from Planck's dipole calibration), as in ACT's baseline
prior:
  cal_dip_prior: "lambda A_act: stats.norm.logpdf(A_act, loc=1.0, scale=0.003)"

params:
  # EDE params
  fEDE:
    prior: {min: 0.001, max: 0.5}
    ref: {dist: norm, loc: 0.05, scale: 0.01}
    proposal: 0.01
    latex: f_\mathrm{EDE}
  log10z_c:
    prior: {min: 3.0, max: 4.3}
    ref: {dist: norm, loc: 3.5, scale: 0.05}
    proposal: 0.05
    latex: \log_{10} z_c
  thetai_scf:
    prior: {min: 0.1, max: 3.1}
    ref: {dist: norm, loc: 2.0, scale: 0.3}
    proposal: 0.1
    latex: \theta_i
  # LCDM sampled params
  omega_b:
    prior: {min: 0.015, max: 0.030}     # bounded: wild points can crash CLASS
    ref: {dist: norm, loc: 0.02259, scale: 0.0001}
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior: {min: 0.08, max: 0.20}
    ref: {dist: norm, loc: 0.1238, scale: 0.001}
    proposal: 0.001
    latex: \Omega_\mathrm{c} h^2
  theta_s_100:
    prior: {min: 1.03, max: 1.055}
    ref: {dist: norm, loc: 1.0418, scale: 0.0003}
    proposal: 0.0002
    latex: 100\theta_\mathrm{s}
    drop: true
  100*theta_s:
    value: "lambda theta_s_100: theta_s_100"
    derived: false
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.053, scale: 0.01}
    proposal: 0.01
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  ln10^{10}A_s:
    value: "lambda logA: logA"
    derived: false
  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.9666, scale: 0.005}
    proposal: 0.004
    latex: n_\mathrm{s}
  tau_reio:
    prior: {min: 0.01, max: 0.8}
    ref: {dist: norm, loc: 0.0562, scale: 0.006}
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  # Derived
  H0:
    latex: H_0
  z_rec:
    latex: z_\mathrm{rec}
  # extra derived outputs (do not affect the fit)
  rs_rec:
    latex: r_{s,\mathrm{rec}}
  z_star:
    latex: z_*
  rd_star:
    latex: r_{d,*}
  z_d:
    latex: z_\mathrm{drag}
  rs_d:
    latex: r_\mathrm{drag}

sampler:
  mcmc:
    covmat: /insomnia001/home/ja4020/CLASS_SilkConsistency/my_analysis/chains/PACT_MCMC_A_d_actprec.covmat   # LCDM part from your P-ACT run; EDE part is learned
    Rminus1_stop: 0.01
    max_tries: 10000

output: chains/PACT_EDE_MCMC
